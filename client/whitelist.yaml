# ============================================================
# whitelist.yaml — 白名单：只有以下域名 / IP 才走代理，其余默认直连。
#
# YAML 列表格式：每行一个条目，- 开头，支持 # 注释、空行忽略。
#   - example.com      域名（精确匹配，并包含其所有子域 www.example.com）
#   - .example.com     域名（只匹配子域，不匹配根域）
#   - 10.0.0.0/24     IP 网段（CIDR 形式，支持 0.0.0.0/0 表示全部 IP）
#
# 说明：
#   - 白名单为空则所有流量直连（等价于关闭代理）
# ============================================================

