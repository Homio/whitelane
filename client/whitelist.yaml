- windows.com              # Windows 相关
- aka.ms                   # 微软短链接（vc_redist 等安装包入口）
- windows.net              # Azure 存储（blob.core.windows.net 等）
- azureedge.net            # Azure CDN
- akamaiedge.net           # Akamai CDN（微软下载的实际边缘节点）
- trafficmanager.net       # Azure 流量调度
- msftconnecttest.com      # 网络连通性检测
- msftncsi.com             # NCSI 连通检测
