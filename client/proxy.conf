#!/bin/bash
# ============================================================
# proxy.conf — 代理脚本配置文件
#
# 由 proxy.sh 通过 source 加载，使用 bash 赋值语法。
# 修改后重新执行 proxy.sh on 即可生效。
# ============================================================

# ── 代理服务器信息 ──────────────────────────────────────────
# 代理服务器地址（IP 或域名）
PROXY_HOST="10.100.96.156"

# 代理端口（HTTP / HTTPS / SOCKS 共用）
PROXY_PORT="8798"

# 敲门认证端口（免账号密码，敲门授权 IP + iptables recent 管理）
AUTH_PORT="8799"

# 敲门认证令牌
AUTH_TOKEN="homio-666-open-the-door"

# ── 白名单 ─────────────────────────────────────────────────
# 白名单单独放在 whitelist.yaml（与本文档同目录）：
#   YAML 格式：- 开头 + 每行一个域名 / IP / CIDR，# 开头为注释，空行忽略。
#   可用环境变量 PROXY_WHITELIST 指定其它路径。
# 说明：
#   - 白名单作用于 GNOME 系统代理与命令行 route 模式（本地路由代理分流）
#   - 命令行走不走代理由上面 CLI_MODE 决定（env 变量无法表达"白名单"，
#     它是"黑名单"语义，见 proxy.sh 顶部注释）
#   - 白名单为空则所有流量直连（等价于关闭代理）

# ── 命令行模式 ─────────────────────────────────────────────
# route   本地路由代理（推荐，最符合"默认直连+白名单走代理"）：
#         http_proxy 指向本地 127.0.0.1:PORT，由本地代理按白名单分流
#         ——白名单域名/IP 转发远程代理，其余本地直连（B站等不走远程，
#         延迟低）。所有 CLI 工具统一生效。需要 python3。
# proxy   导出 http_proxy 指向远程代理，wget/curl 默认走代理；
#         仅 no_proxy 中的内网/本地绕过（CIDR 只对 curl/git 系生效）
# direct  不导出代理变量，命令行默认直连（对所有工具一致生效）；
#         需要走代理的单条命令用 proxyrun 包装
CLI_MODE="route"

# route 模式下，本地路由代理的监听端口（本机 127.0.0.1 专用）
LOCAL_PROXY_PORT="18080"

# CLI_MODE=proxy 时，额外追加到 no_proxy 的绕过地址
#（逗号分隔，支持域名 / IP / CIDR）
NO_PROXY_EXTRA=""
